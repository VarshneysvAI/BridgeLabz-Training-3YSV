<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q2 — Tooltip Demonstration</title>
  <link rel="stylesheet" href="q2.css">
</head>
<body>
  <main class="center">
    <h1>CSS Tooltips</h1>
    <div class="row">
      <div class="tip" data-tip="This is a home icon">🏠</div>
      <div class="tip" data-tip="Search the site">🔎</div>
      <div class="tip" data-tip="User profile">👤</div>
      <div class="tip" data-tip="Settings and preferences">⚙️</div>
    </div>
  </main>
</body>
</html>
