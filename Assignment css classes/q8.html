<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q8 — Box-Sizing Comparison</title>
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <main class="wrap">
    <h1>Box-Sizing Comparison</h1>
    <section class="compare">
      <div class="box default">
        <h3>Default (content-box)</h3>
        <p>Width: 200px; padding:20px; border:5px solid</p>
      </div>
      <div class="box border-box">
        <h3>border-box</h3>
        <p>Width: 200px; padding:20px; border:5px solid</p>
      </div>
    </section>
  </main>
</body>
</html>
