<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q10 — Mini UI Layout</title>
  <link rel="stylesheet" href="q10.css">
</head>
<body>
  <div class="page">
    <header class="site-header">My Compact App</header>
    <main class="card">
      <form>
        <label>Username<input type="text" placeholder="name"></label>
        <label>Password<input type="password" placeholder="password"></label>
        <div class="row">
          <button type="submit" class="primary">Sign In</button>
          <button type="button" class="secondary">Cancel</button>
        </div>
      </form>
      <img src="https://via.placeholder.com/80" alt="avatar" class="thumb">
    </main>
    <footer class="site-footer">© 2026 Example</footer>
  </div>
</body>
</html>
