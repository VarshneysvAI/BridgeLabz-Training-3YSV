<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <h2>Login Form</h2>
    <form method="post" action="#">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <input type="hidden" name="csrf_token" value="dummy-token-12345">

        <input type="submit" value="Login">
    </form>
    <!-- A CSRF token is a secret value used to verify that a form submission comes from an authenticated user and not from a malicious third-party site. -->
</body>
</html>
