<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body>
    <!-- Student report page -->
    <h1>Green Valley Public School</h1>

    <table border="1" cellpadding="8" cellspacing="0" title="Student Result Sheet">
        <caption>Student Mark Sheet</caption>
        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>
        <tr>
            <th>Obtained</th>
            <th>Max</th>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>88</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>92</td>
            <td>100</td>
        </tr>
        <tr>
            <td>English</td>
            <td>85</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Social Studies</td>
            <td>79</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>96</td>
            <td>100</td>
        </tr>
        <tr>
            <th colspan="2">Total</th>
            <td>440</td>
        </tr>
        <tr>
            <th colspan="2">Percentage</th>
            <td>88%</td>
        </tr>
    </table>
</body>
</html>
