<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2 - Google Map</title>
</head>
<body>
    <h1>My City Map</h1>
    <iframe
        title="Map of Delhi"
        src="https://www.google.com/maps?q=Delhi&output=embed"
        width="80%"
        height="450"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>
    <!-- The loading="lazy" attribute tells the browser to load the iframe only when it is near the viewport, which helps improve page speed and performance. -->
</body>
</html>
