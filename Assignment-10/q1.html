<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q1 - Real-Time Product Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    main { max-width: 70rem; margin: auto; }
    #search-input { width: min(100%, 30rem); padding: 0.7rem; }
    #search-results { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; margin-top: 1rem; }
    .product-card { border: 1px solid #bbb; border-radius: 0.5rem; padding: 1rem; }
    .product-card img { width: 100%; height: 8rem; object-fit: contain; }
    #loading-indicator { display: none; }
    #search-error { color: #a40000; }
  </style>
</head>
<body>
  <header><h1>Live Product Search</h1></header>
  <main>
    <section aria-label="Search products">
      <label for="search-input">Search products</label>
      <input id="search-input" type="search" autocomplete="off" placeholder="Type a product name">
      <p id="loading-indicator" role="status">Loading products...</p>
      <p id="search-error" role="alert"></p>
      <div id="search-results" aria-live="polite"></div>
    </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="q1.js"></script>
</body>
</html>
