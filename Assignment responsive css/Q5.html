<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q5 - Filter Cards with Animation</title>
    <link rel="stylesheet" href="Q5.css" />
  </head>
  <body>
    <main class="profile-section">
      <h1>Creative Team</h1>

      <section class="card-row" aria-label="Profile cards">
        <article class="profile-card">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=80" alt="Profile of Alice" />
          <div class="card-info">
            <h2>Alice</h2>
            <p>UI Designer</p>
          </div>
        </article>

        <article class="profile-card">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80" alt="Profile of Daniel" />
          <div class="card-info">
            <h2>Daniel</h2>
            <p>Front-End Developer</p>
          </div>
        </article>

        <article class="profile-card">
          <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=900&q=80" alt="Profile of Maya" />
          <div class="card-info">
            <h2>Maya</h2>
            <p>Content Strategist</p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
