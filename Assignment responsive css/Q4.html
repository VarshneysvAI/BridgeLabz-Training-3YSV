<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q4 - Responsive Typography</title>
    <link rel="stylesheet" href="Q4.css" />

  <body>
    <main class="typography-demo">
      <section class="text-box">
        <h1>Responsive Typography</h1>
        <p>
          Responsive typography helps text read clearly on every screen size. By using
          relative units and the clamp() function, the heading and body text scale smoothly
          according to the viewport width while maintaining readable spacing and balance.
        </p>
      </section>
    </main>
