<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q8 - Filter Comparison Layout</title>
    <link rel="stylesheet" href="Q8.css" />
  </head>
  <body>
    <main class="comparison-section">
      <h1>Before and After Filters</h1>

      <section class="compare-grid" aria-label="Filter comparison layout">
        <figure class="compare-card">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Original nature image" />
          <figcaption>Original</figcaption>
        </figure>

        <figure class="compare-card altered">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Filtered nature image" />
          <figcaption>Filtered</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
