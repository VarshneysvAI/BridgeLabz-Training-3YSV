<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q1 - Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Q1.css" />
  </head>
  <body>
    <main class="gallery-section">
      <h1>Responsive Image Filter Gallery</h1>

      <section class="gallery" aria-label="Image gallery with CSS filters">
        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Forest lake" />
          <figcaption>Blur</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80" alt="Mountain view" />
          <figcaption>Grayscale</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Nature trail" />
          <figcaption>Sepia</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Sunset" />
          <figcaption>Brightness</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80" alt="Lake reflection" />
          <figcaption>Contrast</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=900&q=80" alt="Waterfall" />
          <figcaption>Hue Rotate</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
