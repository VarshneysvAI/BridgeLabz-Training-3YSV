<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadows and Depth</title>
    <link rel="stylesheet" href="q4.css" />
  </head>
  <body>
    <header>
      <h1>Shadow Depth Layout</h1>
    </header>

    <main class="card-row">
      <article class="card card-one">
        <h2>Soft Shadow</h2>
        <p>A calm and minimal card with a gentle depth effect.</p>
      </article>

      <article class="card card-two">
        <h2>Strong Shadow</h2>
        <p>This card shows a more prominent elevated surface.</p>
      </article>

      <article class="card card-three">
        <h2>Glow Shadow</h2>
        <p>Bright accents create a floating, modern feel.</p>
      </article>
    </main>
  </body>
</html>
