<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Selectors</title>
    <link rel="stylesheet" href="q5.css" />
  </head>
  <body>
    <main class="demo-wrap">
      <section class="selector-demo">
        <h1>Advanced CSS Selectors</h1>

        <ul class="item-list">
          <li>First item</li>
          <li>Second item</li>
          <li>Third item</li>
          <li>Fourth item</li>
          <li>Fifth item</li>
        </ul>

        <nav class="menu">
          <a href="https://example.com">External Link</a>
          <a href="#section">Local Link</a>
          <a href="https://google.com">Another External</a>
        </nav>

        <label class="field-label" for="name">Name</label>
        <input id="name" type="text" placeholder="Enter text" />

        <div class="box-group">
          <p>First paragraph</p>
          <p>Second paragraph</p>
        </div>
      </section>
    </main>
  </body>
</html>
