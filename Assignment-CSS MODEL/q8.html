<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="q8.css" />
  </head>
  <body>
    <main class="demo-area">
      <div class="model-box">
        <div class="content-layer">
          <h2>Content</h2>
          <p>Text and images inside the box.</p>
        </div>
      </div>

      <div class="box-legend">
        <p><span class="swatch content"></span> Content</p>
        <p><span class="swatch padding"></span> Padding</p>
        <p><span class="swatch border"></span> Border</p>
        <p><span class="swatch margin"></span> Margin</p>
      </div>
    </main>
  </body>
</html>
