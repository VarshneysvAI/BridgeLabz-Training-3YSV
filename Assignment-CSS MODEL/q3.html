<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient Background</title>
    <link rel="stylesheet" href="q3.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Gradient Layout Demo</h1>
    </header>

    <main>
      <section class="linear-section">
        <div class="content-box">
          <h2>Linear Gradient</h2>
          <p>This section uses a linear gradient background from blue to purple.</p>
        </div>
      </section>

      <section class="radial-section">
        <div class="content-box">
          <h2>Radial Gradient</h2>
          <p>This section uses a radial gradient with a glowing center effect.</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Footer</p>
    </footer>
  </body>
</html>
