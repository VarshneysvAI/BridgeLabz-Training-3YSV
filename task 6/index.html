<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sports Shoe Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="product-stage">
        <div class="offer-badge">20% OFF</div>

        <button class="wishlist" aria-label="Add to wishlist">♡</button>

        <img
          class="shoe-image"
          src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1200&q=80"
          alt="Premium running shoes"
        />
      </div>

      <div class="details">
        <div class="category">SPORTS SHOES</div>
        <h1>Premium Running Shoes</h1>

        <div class="rating-row">
          <span class="stars">★★★★★</span>
          <span class="count">(120)</span>
        </div>

        <div class="price-row">
          <span class="price current">₹1,999</span>
          <span class="price old">₹2,499</span>
        </div>
      </div>

      <button class="cart-btn">Add to Cart</button>
    </div>
  </body>
</html>
