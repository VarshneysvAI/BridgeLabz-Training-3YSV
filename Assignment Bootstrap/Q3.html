<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q3 - Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="Q3.css" />
  </head>
  <body>
    <main class="container py-5">
      <header class="text-center mb-5">
        <h1 class="fw-bold">Featured Products</h1>
        <p class="text-muted">Curated essentials for modern living</p>
      </header>

      <!-- Bootstrap grid: 4 columns on desktop, 2 on tablet, 1 on mobile -->
      <section class="row g-4">
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 border-0 shadow-sm product-card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Running shoes" />
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Urban Runner</h5>
              <p class="text-muted mb-3">Premium performance sneakers</p>
              <div class="mt-auto d-flex justify-content-between align-items-center">
                <span class="fw-bold">$120</span>
                <button class="btn btn-dark btn-sm">Add to Cart</button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 border-0 shadow-sm product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Watch" />
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Pulse Watch</h5>
              <p class="text-muted mb-3">Elegant smart timepiece</p>
              <div class="mt-auto d-flex justify-content-between align-items-center">
                <span class="fw-bold">$180</span>
                <button class="btn btn-dark btn-sm">Add to Cart</button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 border-0 shadow-sm product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Headphones" />
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Audio Pro</h5>
              <p class="text-muted mb-3">Noise-canceling headphones</p>
              <div class="mt-auto d-flex justify-content-between align-items-center">
                <span class="fw-bold">$220</span>
                <button class="btn btn-dark btn-sm">Add to Cart</button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 border-0 shadow-sm product-card">
            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Backpack" />
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Summit Pack</h5>
              <p class="text-muted mb-3">Travel-ready adventure backpack</p>
              <div class="mt-auto d-flex justify-content-between align-items-center">
                <span class="fw-bold">$90</span>
                <button class="btn btn-dark btn-sm">Add to Cart</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
