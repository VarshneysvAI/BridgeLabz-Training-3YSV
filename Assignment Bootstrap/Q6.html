<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q6 - Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="Q6.css" />
  </head>
  <body>
    <main class="container py-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h2 class="mb-4 fw-bold">Notifications</h2>

          <!-- Success alert -->
          <div class="alert alert-success alert-dismissible fade show" role="alert">
            <strong>Success:</strong> Your profile has been updated successfully.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>

          <!-- Info alert -->
          <div class="alert alert-info alert-dismissible fade show" role="alert">
            <strong>Tip:</strong> You have 3 new onboarding lessons ready to review.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>

          <!-- Danger alert -->
          <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Warning:</strong> Your password expires in 2 days.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>

          <!-- Summary well -->
          <div class="bg-light border rounded p-4 mt-4">
            <h4 class="fw-bold">Summary</h4>
            <p class="mb-0">You have 12 unread messages, 7 scheduled reminders, and 1 urgent alert requiring action.</p>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
