<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q2 - Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="Q2.css" />
  </head>
  <body class="bg-light text-dark">
    <header class="container py-4">
      <div class="text-center">
        <h1 class="fw-bold mb-1">Aisha Rahman</h1>
        <p class="text-muted mb-0">UI/UX Designer & Front-End Developer</p>
      </div>
    </header>

    <main class="container py-4">
      <section class="row align-items-center g-4">
        <div class="col-md-6 text-center text-md-start">
          <p class="text-primary fw-semibold mb-2">Hello, I’m</p>
          <h2 class="display-5 fw-bold mb-3">Creative digital storyteller.</h2>
          <p class="lead mb-4">
            I design thoughtful interfaces and craft user-friendly experiences that look beautiful on every screen.
          </p>
          <div class="d-flex justify-content-center justify-content-md-start gap-3 flex-wrap">
            <button class="btn btn-dark px-4">Hire Me</button>
            <button class="btn btn-outline-dark px-4">Download CV</button>
          </div>
        </div>

        <div class="col-md-6 text-center">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=800&q=80" alt="Profile portrait" class="img-fluid rounded-circle profile-photo shadow" />
        </div>
      </section>

      <section class="row mt-5">
        <div class="col-lg-6 mx-auto">
          <div class="card border-0 shadow-sm p-4">
            <h3 class="text-center fw-bold mb-3">Contact Me</h3>
            <form>
              <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" placeholder="Your name" />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Your email" />
              </div>
              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100">Send Message</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
