<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q8 - Pricing Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="Q8.css" />
  </head>
  <body>
    <main class="container py-5">
      <header class="text-center mb-5">
        <p class="text-primary fw-semibold text-uppercase">Simple pricing</p>
        <h1 class="fw-bold">Choose Your Plan</h1>
      </header>

      <section class="row g-4">
        <div class="col-md-4">
          <div class="card h-100 shadow-sm border-0 plan-card">
            <div class="card-body p-4">
              <h3 class="fw-bold">Starter</h3>
              <div class="price my-3">$19<span>/mo</span></div>
              <ul class="list-unstyled">
                <li>✓ 1 project</li>
                <li>✓ Email support</li>
                <li>✓ Basic analytics</li>
              </ul>
              <button class="btn btn-outline-primary w-100">Get Started</button>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card h-100 shadow-lg border-0 plan-card highlighted">
            <div class="card-body p-4 text-white">
              <h3 class="fw-bold">Pro</h3>
              <div class="price my-3">$49<span>/mo</span></div>
              <ul class="list-unstyled">
                <li>✓ Unlimited projects</li>
                <li>✓ Priority support</li>
                <li>✓ Advanced reports</li>
              </ul>
              <button class="btn btn-light w-100 text-primary">Choose Pro</button>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card h-100 shadow-sm border-0 plan-card">
            <div class="card-body p-4">
              <h3 class="fw-bold">Business</h3>
              <div class="price my-3">$99<span>/mo</span></div>
              <ul class="list-unstyled">
                <li>✓ Team collaboration</li>
                <li>✓ Custom integrations</li>
                <li>✓ Dedicated manager</li>
              </ul>
              <button class="btn btn-outline-primary w-100">Contact Sales</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
