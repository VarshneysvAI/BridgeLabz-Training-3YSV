<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q9 - Blog Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="Q9.css" />
  </head>
  <body>
    <main class="container py-5">
      <section class="text-center mb-4">
        <h1 class="fw-bold">Latest Articles</h1>
      </section>

      <div class="d-flex justify-content-center mb-4">
        <nav aria-label="Page navigation">
          <ul class="pagination">
            <li class="page-item"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
          </ul>
        </nav>
      </div>

      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <button class="btn btn-outline-secondary">Older Posts</button>
        <button class="btn btn-outline-secondary">Newer Posts</button>
      </div>
    </main>
  </body>
</html>
