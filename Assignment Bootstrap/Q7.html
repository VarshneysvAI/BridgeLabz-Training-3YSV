<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q7 - Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="Q7.css" />
  </head>
  <body>
    <main class="container py-5">
      <section class="card shadow-sm border-0">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">Task Tracker</h2>
            <span class="badge bg-primary rounded-pill fs-6">8 pending</span>
          </div>

          <div class="list-group">
            <div class="list-group-item d-flex justify-content-between align-items-center">
              <div>
                <h6 class="mb-1">Design landing page</h6>
                <small class="text-muted">Due today</small>
              </div>
              <span class="badge bg-danger">High</span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
              <div>
                <h6 class="mb-1">Update marketing assets</h6>
                <small class="text-muted">Due tomorrow</small>
              </div>
              <span class="badge bg-warning text-dark">Medium</span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
              <div>
                <h6 class="mb-1">Schedule client call</h6>
                <small class="text-muted">Next week</small>
              </div>
              <span class="badge bg-success">Low</span>
            </div>
          </div>

          <div class="mt-4 d-flex justify-content-end">
            <button class="btn btn-success">
              Completed
              <span class="badge bg-white text-success ms-2">3</span>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
