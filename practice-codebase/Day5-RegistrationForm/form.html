<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
<!-- using CSS also for designing it more drastically -->
    <form action="/submit" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required placeholder="Enter your age">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password">
        <br><br>

        <label for="phone">Phone No:</label>
        <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br><br>
        <label for="skills">Skills:</label>
        <Section>
                <input id = "html" type="checkbox" name="html" value="HTML">
                <label for="html">HTML</label>
                <input id = "css" type="checkbox" name="css" value="CSS">
                <label for="css">CSS</label>
                <input id = "js" type="checkbox" name="js" value="JavaScript">
                <label for="js">JavaScript</label>
        </Section>
        <br><br>
        <label for="profile_picture">Profile Picture:</label>
        <input type="file" id="profile_picture" name="profile_picture" accept="image/*">
        <br><br>
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions</label>
        <br><br>
        <button type="submit" value="Register">Register</button>
        <br><br>

    </form>
</body>
</html>
