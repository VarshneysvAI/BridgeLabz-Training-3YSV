<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .form-box {
            width: 640px;
            background-color: #ffffff;
            border: 1px solid #999999;
            padding: 16px;
            box-shadow: 0 0 10px rgba(0,0,0,0.12);
        }
        .form-title {
            text-align: center;
            margin: 0 0 12px;
            font-size: 1.35rem;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table th,
        table td {
            border: 1px solid #999999;
            padding: 10px 12px;
            vertical-align: middle;
        }
        table th {
            text-align: center;
            background-color: #f8f8f8;
            font-weight: normal;
        }
        .label-cell {
            width: 30%;
            font-weight: bold;
            background-color: #f8f8f8;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #bbb;
            border-radius: 3px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        input[type="radio"],
        input[type="checkbox"] {
            margin: 0 6px 0 0;
        }
        .actions {
            text-align: center;
            padding-top: 10px;
        }
        input[type="submit"],
        input[type="reset"] {
            padding: 8px 18px;
            margin: 0 6px;
            border: 1px solid #555;
            border-radius: 3px;
            background-color: #e8e8e8;
            cursor: pointer;
            font-size: 0.95rem;
        }
        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background-color: #d8d8d8;
        }
        .input-inline {
            display: inline-block;
            vertical-align: middle;
        }
        .checkbox-group,
        .radio-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        textarea {
            height: 80px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2 class="form-title">Student Registration Form</h2>
            <form action="#" method="post" enctype="multipart/form-data">
                <table>
                    <tr>
                        <th colspan="2">Registration Form</th>
                    </tr>
                    <tr>
                        <td class="label-cell">Full Name</td>
                        <td><input for="fullname" type="text" name="fullname" placeholder="Enter your name" required></td>
                    </tr>
                    <tr>
                        <td class="label-cell">Email</td>
                        <td><input for="email" type="email" name="email" placeholder="abc@gmail.com" required></td>
                    </tr>
                    <tr>
                        <td class="label-cell">Phone Number</td>
                        <td><input for="phone" type="tel" name="phone" placeholder="9876543210" required></td>
                    </tr>
                    <tr>
                        <td class="label-cell">Date of Birth</td>
                        <td><input for="dob" type="date" name="dob" required></td>
                    </tr>
                    <tr>
                        <td class="label-cell">Gender</td>
                        <td>
                            <div class="radio-group">
                                <label><input for="male" type="radio" name="gender" value="male" required>Male</label>
                                <label><input for="female" type="radio" name="gender" value="female">Female</label>
                                <label><input for="other" type="radio" name="gender" value="other">Other</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="label-cell">Skills</td>
                        <td>
                            <div class="checkbox-group">
                                <label><input for="html" type="checkbox" name="skills" value="HTML">HTML</label>
                                <label><input for="css" type="checkbox" name="skills" value="CSS">CSS</label>
                                <label><input for="javascript" type="checkbox" name="skills" value="JavaScript">JavaScript</label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="label-cell">Course</td>
                        <td>
                            <select name="course" required>
                                <option value="">-Select Course-</option>
                                <option value="bca">BCA</option>
                                <option value="bba">BBA</option>
                                <option value="btech">B.Tech</option>
                                <option value="mca">MCA</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td class="label-cell">Address</td>
                        <td><textarea name="address" placeholder="Enter your address" required></textarea></td>
                    </tr>
                    <tr>
                        <td class="label-cell">Upload Resume</td>
                        <td><input for="resume" type="file" name="resume" accept=".pdf,.doc,.docx"></td>
                    </tr>
                    <tr>
                        <td colspan="2" class="actions">
                            <input type="submit" value="Register">
                            <input type="reset" value="Reset">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</body>
</html>
